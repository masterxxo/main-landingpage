server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nuxt SPA fallback (nuxt generate emits 200.html)
    location / {
        try_files $uri $uri/ /200.html;
    }

    # Hashed build assets / fonts — safe to cache forever
    location ~ ^/(_nuxt|_fonts)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media / fonts from public/ — moderate cache
    location ~* \.(?:jpg|jpeg|png|gif|svg|webp|avif|ico|mp4|webm|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
